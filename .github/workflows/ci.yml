name: Firmware Analysis CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Python syntax of scripts
        run: |
          python3 -m py_compile scripts/extract.py scripts/diff_mcu.py

      - name: Run extraction and diff if firmware images are present
        run: |
          if [ -f "firmware/v0.2.5_0.5.lcd" ] && [ -f "firmware/v0.3.0_0.7.lcd" ]; then
            make all
          else
            echo "Firmware binaries not committed; skipping live extraction."
          fi

  site-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check that index.html's script parses and loads nothing from outside
        run: node tests/check-static.cjs

      - name: Check that index.html matches its template
        run: python3 site/build.py --check

  site-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Playwright and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build with the page and the reference script on a synthetic firmware file, and compare
        run: npm test
