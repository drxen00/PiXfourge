    <clipPath id="r"><rect width="900" height="270" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="900" height="270" fill="#16181A"/>
    <rect width="900" height="26" fill="url(#hz)"/>
